<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATRIUM · Gestión académica</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --c1: #1E3A8A;
        --ac: #10B981;
        --pri: #1E3A8A;
        --pri2: #3B5BC7;
        --bg: #F3F4F6;
        --card: #fff;
        --tx: #111827;
        --mu: #6B7280;
        --bd: #E5E7EB;
        --ok: #10B981;
        --bad: #EF4444;
        --warn: #F59E0B;
        --side: #1E3A8A;
        --okb: #D1FAE5;
        --badb: #FEE2E2;
        --wb: #FEF3C7;
        --hov: #F9FAFB;

        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Modo oscuro automático (si el usuario no fuerza el claro) */
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #0F172A;
            --card: #1E293B;
            --tx: #F1F5F9;
            --mu: #94A3B8;
            --bd: #334155;
            --side: #172554;
            --okb: #064E3B;
            --badb: #7F1D1D;
            --wb: #78350F;
            --hov: #243247;
            --pri: #93B4FF;
        }
    }

    /* Modo oscuro forzado */
    :root[data-theme="dark"] {
        --bg: #0F172A;
        --card: #1E293B;
        --tx: #F1F5F9;
        --mu: #94A3B8;
        --bd: #334155;
        --side: #172554;
        --okb: #064E3B;
        --badb: #7F1D1D;
        --wb: #78350F;
        --hov: #243247;
        --pri: #93B4FF;
    }

    html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
    }


    /* =========================================================
       02 · BASE
       ========================================================= */
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font: 14px/1.5 Inter, Roboto, system-ui, sans-serif;
        background: var(--bg);
        color: var(--tx);
    }

    svg.i {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
    }

    select,
    input,
    textarea {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 8px 10px;
        max-width: 100%;
    }

    main {
        padding: 24px;
        flex: 1;
    }

    main h2 {
        font-size: 24px;
        letter-spacing: -.02em;
        font-weight: 700;
    }


    /* =========================================================
       03 · SHELL
       ========================================================= */

    /* ---- Sidebar ---- */
    #side {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 248px;
        display: flex;
        flex-direction: column;
        padding: 20px 12px;
        padding-top: calc(20px + env(safe-area-inset-top, 0px));
        color: #fff;
        z-index: 20;
        transition: transform .2s;
        background:
                radial-gradient(130% 55% at 0 100%, color-mix(in srgb, var(--ac) 30%, transparent), transparent 60%),
                linear-gradient(180deg, color-mix(in srgb, var(--c1) 55%, #000), var(--c1));
    }

    /* ---- Marca ---- */
    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: .5px;
        padding: 0 10px 4px;
    }

    .logo b {
        color: var(--ac, #6EE7B7);
    }

    .sub {
        padding: 0 10px 18px;
        font-size: 12px;
        opacity: .7;
    }

    /* ---- Navegación ---- */
    #nav {
        flex: 1;
        overflow-y: auto;
    }

    /* Botones simples (legacy) */
    #nav button {
        all: unset;
        box-sizing: border-box;
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        color: #DBE4FF;
        margin-bottom: 2px;
    }

    #nav button:hover {
        background: rgba(255, 255, 255, .1);
    }

    #nav button.on {
        background: rgba(255, 255, 255, .14);
        color: #fff;
        font-weight: 600;
        box-shadow: inset 3px 0 0 #10B981;
    }

    #nav button:focus-visible {
        outline: 2px solid #6EE7B7;
    }

    /* Navegación agrupada */
    #nav .ni,
    #nav .gh {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 6px 8px;
        border-radius: 12px;
        cursor: pointer;
        color: #C7D4FF;
        background: none;
        border: 0;
        font: inherit;
        margin-bottom: 2px;
    }

    #nav .ni:hover,
    #nav .gh:hover {
        background: rgba(255, 255, 255, .09);
        color: #fff;
    }

    #nav .ni.on {
        background: #fff;
        color: var(--c1);
        font-weight: 600;
        box-shadow: 0 8px 18px -8px rgba(0, 0, 0, .5);
    }

    #nav .ti {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: rgba(255, 255, 255, .08);
        display: grid;
        place-items: center;
        flex: none;
    }

    #nav .ni.on .ti {
        background: var(--ac);
        color: #fff;
    }

    #nav .gh .lb {
        flex: 1;
        text-align: left;
        font-size: 12px;
        opacity: .7;
    }

    #nav .gh .cv {
        width: 16px;
        height: 16px;
        transition: .2s;
    }

    #nav .gh.op .cv {
        transform: rotate(180deg);
    }

    #nav .ch {
        margin: 0 0 8px 24px;
        padding-left: 10px;
        border-left: 1px solid rgba(255, 255, 255, .18);
    }

    #nav .ch .ni {
        font-size: 13px;
        padding: 4px 8px;
    }

    #nav .ch .ti {
        width: 26px;
        height: 26px;
        border-radius: 8px;
    }

    #nav .ch .ti svg {
        width: 15px;
        height: 15px;
    }

    /* ---- Usuario ---- */
    .me {
        margin-top: auto;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-top: 1px solid rgba(255, 255, 255, .15);
        font-size: 13px;
    }

    .av {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #10B981;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        flex: none;
    }

    .av.sm {
        width: 32px;
        height: 32px;
        font-size: 13px;
    }

    .av.xl {
        width: 84px;
        height: 84px;
        font-size: 28px;
        border: 4px solid var(--card);
    }

    /* ---- Contenedor principal ---- */
    #main {
        margin-left: 248px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ---- Header ---- */
    header {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        padding: 14px 24px;
        background: color-mix(in srgb, var(--card) 90%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--bd);
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
    }

    header h1 {
        font-size: 18px;
        margin: 0;
    }

    header p {
        margin: 0;
        color: var(--mu);
        font-size: 12px;
    }

    .sp {
        flex: 1;
    }

    #burger {
        display: none;
    }

    .ib {
        all: unset;
        cursor: pointer;
        position: relative;
        padding: 8px;
        border-radius: 8px;
        color: var(--mu);
    }

    .ib:hover {
        background: var(--bg);
    }

    .badge {
        position: absolute;
        top: 2px;
        right: 2px;
        background: var(--bad);
        color: #fff;
        font-size: 10px;
        border-radius: 9px;
        padding: 0 5px;
    }

    .clock {
        text-align: right;
        font-variant-numeric: tabular-nums;
    }

    .clock b {
        font-size: 20px;
        font-weight: 700;
        color: var(--pri);
    }

    /* ---- Footer ---- */
    footer {
        padding: 16px 24px;
        border-top: 1px solid var(--bd);
        color: var(--mu);
        font-size: 12px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        background: var(--card);
    }

    footer a {
        color: var(--pri);
        text-decoration: none;
    }

    /* ---- Toast ---- */
    .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--tx);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 8px;
        z-index: 50;
    }


    /* =========================================================
       04 · COMPONENTES
       ========================================================= */

    /* ---- Grids ---- */
    .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        margin-bottom: 20px;
    }

    .g2 {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    /* ---- Card ---- */
    .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 24px -14px rgba(30, 58, 138, .18);
    }

    .card h3 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
    }

    /* ---- Stat ---- */
    .stat {
        display: flex;
        gap: 14px;
        align-items: center;
    }

    .stat .ic {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: #fff;
    }

    .stat b {
        font-size: 24px;
        display: block;
        line-height: 1.1;
    }

    .stat span {
        color: var(--mu);
        font-size: 12px;
    }

    /* ---- KPI ---- */
    .kpi {
        padding: 16px 18px;
    }

    .kpi b {
        font-size: 30px;
        letter-spacing: -.03em;
        display: block;
        margin: 4px 0 6px;
        line-height: 1.1;
    }

    .kh {
        display: flex;
        justify-content: space-between;
        color: var(--mu);
        font-size: 13px;
    }

    .kh i {
        display: grid;
    }

    .kf {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .kf em {
        font-style: normal;
        font-size: 12px;
        font-weight: 600;
    }

    .up { color: var(--ok); }
    .dn { color: var(--bad); }

    /* ---- Hero ---- */
    .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 24px;
        border-radius: 16px;
        margin-bottom: 16px;
        color: #fff;
        background: radial-gradient(circle at 90% 0, var(--pri2), transparent 55%), var(--c1);
    }

    .hero small {
        opacity: .8;
        display: block;
    }

    .hero b {
        font-size: 44px;
        letter-spacing: -.03em;
        margin-right: 12px;
    }

    .hero .btn.o {
        color: #fff;
        border-color: rgba(255, 255, 255, .4);
    }

    /* ---- Barras y mapa de calor ---- */
    .bar {
        height: 8px;
        background: var(--bd);
        border-radius: 4px;
        overflow: hidden;
        min-width: 80px;
    }

    .bar i {
        display: block;
        height: 100%;
    }

    .heat {
        display: grid;
        grid-template-rows: repeat(5, 1fr);
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 4px;
    }

    .heat i {
        min-height: 16px;
        border-radius: 4px;
    }

    .hb {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 10px;
        align-items: center;
        padding: 7px 0;
    }

    /* ---- Tablas ---- */
    .tw {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 480px;
    }

    th {
        text-align: left;
        color: var(--mu);
        font-weight: 600;
        font-size: 12px;
        padding: 8px 10px;
        background: var(--bg);
        border: 0;
    }

    th:first-child { border-radius: 8px 0 0 8px; }
    th:last-child  { border-radius: 0 8px 8px 0; }

    td {
        padding: 10px;
        border-bottom: 1px solid var(--bd);
    }

    tr:hover td {
        background: var(--hov);
    }

    /* ---- Pills ---- */
    .pill {
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
    }

    .ok  { background: var(--okb);  color: #047857; }
    .bad { background: var(--badb); color: #B91C1C; }
    .wn  { background: var(--wb);   color: #B45309; }

    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .ok  { color: #6EE7B7; }
        :root:not([data-theme="light"]) .bad { color: #FCA5A5; }
        :root:not([data-theme="light"]) .wn  { color: #FCD34D; }
    }

    /* ---- Botones ---- */
    .btn {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        background: var(--pri2);
        color: #fff;
        padding: 9px 16px;
        border-radius: 8px;
        font-weight: 500;
        display: inline-flex;
        gap: 8px;
        align-items: center;
    }

    .btn:hover {
        filter: brightness(1.1);
    }

    .btn:focus-visible {
        outline: 2px solid var(--ok);
        outline-offset: 2px;
    }

    .btn.g { background: var(--ok); }

    .btn.o {
        background: transparent;
        color: var(--pri);
        border: 1px solid var(--bd);
    }

    .acts {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .tg {
        all: unset;
        cursor: pointer;
        padding: 4px 12px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
    }

    /* ---- Mensajes ---- */
    .msg {
        padding: 12px 0;
        border-bottom: 1px solid var(--bd);
    }

    .msg:last-child {
        border: 0;
    }

    .msg small {
        color: var(--mu);
    }

    /* ---- Calendario ---- */
    .cal {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
    }

    .cal div {
        background: var(--bg);
        border-radius: 8px;
        padding: 8px;
        min-height: 90px;
        font-size: 12px;
    }

    .cal b {
        display: block;
        margin-bottom: 4px;
    }

    .cal em {
        display: block;
        font-style: normal;
        background: var(--pri2);
        color: #fff;
        border-radius: 4px;
        padding: 2px 6px;
        margin-top: 4px;
    }

    /* ---- Formularios ---- */
    .form {
        display: grid;
        gap: 10px;
    }

    .form label {
        font-size: 12px;
        color: var(--mu);
    }

    /* ---- Datos clave-valor ---- */
    .kv {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 18px;
    }

    .f span {
        display: block;
        color: var(--mu);
        font-size: 12px;
        margin-bottom: 4px;
    }

    .f b {
        font-weight: 500;
        display: block;
        padding: 9px 0;
        border-bottom: 1px solid var(--bd);
        word-break: break-word;
    }

    .f input {
        width: 100%;
    }


    /* =========================================================
       05 · PANTALLAS
       ========================================================= */

    /* ---- Chips ---- */
    .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .chips span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        background: var(--bg);
        padding: 6px 12px;
        border-radius: 99px;
        font-weight: 500;
    }

    .chips svg {
        width: 16px;
        height: 16px;
        color: var(--pri2);
    }

    .chs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .tg2 {
        all: unset;
        cursor: pointer;
        padding: 6px 14px;
        border: 1px solid var(--bd);
        border-radius: 99px;
        font-size: 13px;
    }

    .tg2.on {
        background: var(--pri2);
        color: #fff;
        border-color: var(--pri2);
    }

    /* ---- Lista de asistencia ---- */
    .stu {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--bd);
        flex-wrap: wrap;
    }

    .stu b {
        flex: 1;
        min-width: 120px;
        font-weight: 500;
    }

    .seg {
        display: flex;
        border: 1px solid var(--bd);
        border-radius: 10px;
        overflow: hidden;
    }

    .seg button {
        all: unset;
        cursor: pointer;
        padding: 7px 14px;
        font-size: 13px;
        color: var(--mu);
    }

    .seg .on.ok { background: var(--ok);  color: #fff; }
    .seg .on.no { background: var(--bad); color: #fff; }

    /* ---- Perfil ---- */
    .pf {
        padding: 0;
        overflow: hidden;
        margin-bottom: 16px;
    }

    .cover {
        height: 96px;
        background: radial-gradient(circle at 80% 0, var(--pri2), transparent 60%), var(--c1);
    }

    .pfh {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 0 20px 20px;
        margin-top: -36px;
        flex-wrap: wrap;
    }

    /* ---- Switches ---- */
    .sw {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 0;
        border-bottom: 1px solid var(--bd);
        cursor: pointer;
    }

    .sw input {
        display: none;
    }

    .sw i {
        width: 38px;
        height: 22px;
        border-radius: 99px;
        background: var(--bd);
        position: relative;
        transition: .2s;
    }

    .sw i:after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: .2s;
    }

    .sw input:checked + i {
        background: var(--ok);
    }

    .sw input:checked + i:after {
        left: 19px;
    }

    .sw.off {
        opacity: .55;
        cursor: default;
    }

    .ra {
        display: flex;
        gap: 2px;
    }

    .ra .ib {
        padding: 6px;
    }

    /* ---- Modales ---- */
    .mo {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, .55);
        display: grid;
        place-items: center;
        padding: 16px;
        z-index: 60;
    }

    .md {
        background: var(--card);
        border-radius: 14px;
        width: 100%;
        max-width: 460px;
        max-height: 90vh;
        overflow: auto;
    }

    .mh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid var(--bd);
    }

    .mh h3 {
        margin: 0;
        font-size: 16px;
    }

    .mb {
        padding: 18px;
    }

    .mf {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        padding: 0 18px 18px;
        flex-wrap: wrap;
    }

    .dl {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .dl small {
        color: var(--mu);
        display: block;
    }

    .mrow {
        display: grid;
        grid-template-columns: 70px 1fr;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
    }

    .mrow label {
        color: var(--mu);
        font-size: 12px;
    }

    .mrow input,
    .mrow select,
    textarea {
        width: 100%;
    }

    /* ---- Correo ---- */
    .em {
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 16px;
        background: var(--bg);
    }

    .em h4 {
        margin: 8px 0;
        font-size: 16px;
    }

    .em p {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0 0 12px;
    }

    .eh {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--pri2);
        flex: none;
    }

    .row {
        display: flex;
        gap: 10px;
        align-items: center;
        cursor: pointer;
    }


    /* =========================================================
       06 · IDENTIDAD INSTITUCIONAL
       ========================================================= */
    .lg {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--ac);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        overflow: hidden;
        flex: none;
    }

    .lg img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
    }

    .ins {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        align-items: start;
    }

    .pvw {
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--bd);
    }

    .pvs {

      `<div class="ra">${iconBtn("eye", "Ver detalles", `histView(${h.id})`)}${iconBtn("edit", "Editar", `histEdit(${h.id})`)}${iconBtn("trash", "Eliminar", `histDelete(${h.id})`, 'style="color:var(--bad)"')}</div>`
    ]);
    return `<div class="acts"><button class="btn o" onclick="exportModal()">${ic("down")}Exportar</button></div>` + card(all ? "Asistencia dictada por profesores" : "Clases dictadas", table(headers, rows));
  }
  function histView(id) {
    const h = findRecord(id);
    modal(
      "Detalle de la clase",
      `<div class="dl"><div><small>Curso</small><b>${h.c}</b></div><div><small>Fecha</small><b>${h.f}</b></div><div><small>Profesor</small><b>${h.pr}</b></div><div><small>Asistencia</small>${pill(attendancePct(h))}</div><div><small>Presentes</small><b style="color:var(--ok)">${h.p}</b></div><div><small>Ausentes</small><b style="color:var(--bad)">${h.a}</b></div></div>`,
      btn("Cerrar", "o", "closeModal()") + btn("Editar", "", `histEdit(${id})`)

  }
  function histEdit(id) {
    const h = findRecord(id);

      "Editar registro",
      `<div class="mrow"><label>Fecha</label><input id="ef" value="${h.f}"></div><div class="mrow"><label>Presentes</label><input id="ep" type="number" min="0" value="${h.p}"></div><div class="mrow"><label>Ausentes</label><input id="ea" type="number" min="0" value="${h.a}"></div>`,

  function histSave(id) {

  }
  function histDelete(id) {
    const h = findRecord(id);

  function histDeleteOk(id) {
    db.hist = db.hist.filter((x) => x.id != id);

    render();

  }
  var historyHandlers = { histView, histEdit, histSave, histDelete, histDeleteOk };

  // js/views/shared/reports.js
  var reportsView = () => `<div class="hero"><div><small>Asistencia global del periodo</small><b>91,4%</b><span class="pill ok">▲ 2,1% vs. periodo anterior</span></div><button class="btn o" onclick="exportModal()">${ic("down")}Exportar</button></div><div class="grid">${kpi("Sesiones dictadas", "1.204", "#1E3A8A", "cal") + kpi("Ausencias", "312", "#EF4444", "clock") + kpi("Estudiantes en riesgo", "37", "#F59E0B", "users")}</div><div class="grid g2">${card("Mapa de asistencia · últimas 14 semanas", heat())}${card("Distribución", donut(88, 4, 8))}</div><div class="grid g2">${card("Asistencia por curso", COURSES.map((c) => `<div class="hb"><span>${c.name}</span>${progress(c.attendance)}</div>`).join(""))}${card(
    "Estudiantes en riesgo",
    table(["Estudiante", "Curso", "%"], [["Camila Ríos", "Programación", pill(71)], ["Diego Soto", "Química", pill(68)], ["Sara Núñez", "Física II", pill(73)]])
  )}</div>`;

  // js/ui/mail.js
  var mail = (name, subject, to, message) => `<div class="em"><div class="eh"><div class="av">${name.split(" ").map((x) => x[0]).slice(0, 2).join("")}</div><div><b>${name}</b><br><small>Para: ${to}</small></div></div><h4>${subject}</h4><p>${message}</p><small>Enviado desde ATRIUM</small></div>`;

  // js/views/shared/compose.js
  function composeView() {
    const u = USER[state.role];
    const ch = state.channels;
    return `<div class="grid g2"><div class="card"><h3>Nuevo mensaje</h3><div class="mrow"><label>Para</label><select id="nc" onchange="previewMessage()"><option>Todos mis estudiantes</option><option>Cálculo I · 42 estudiantes</option><option>Programación · 45 estudiantes</option></select></div><div class="mrow"><label>Asunto</label><input id="ns" oninput="previewMessage()" placeholder="Asunto del aviso"></div><div class="mrow"><label>Canal</label><div class="chs"><button class="tg2 ${ch.c ? "on" : ""}" onclick="toggleChannel('c',this)">Correo</button><button class="tg2 ${ch.p ? "on" : ""}" onclick="toggleChannel('p',this)">Notificación</button></div></div><textarea id="nm" rows="7" oninput="previewMessage()" placeholder="Escribe tu mensaje…"></textarea><div class="acts" style="margin:14px 0 0;justify-content:flex-end"><button class="btn o" onclick="toast('Borrador guardado')">Guardar borrador</button><button class="btn g" id="sb" onclick="sendMessage()">${ic("send")}Enviar</button></div></div><div class="card"><h3>Vista previa</h3><div class="em"><div class="eh"><div class="av">${u.initials}</div><div><b>${u.name}</b><br><small>Para: <span id="pt">Todos mis estudiantes</span></small></div></div><h4 id="ps">(Sin asunto)</h4><p id="pm">El mensaje aparecerá aquí.</p><small>Enviado desde ATRIUM</small></div></div></div>` + card(
      "Enviados",
      sentMessages.map((s, i) => `<div class="msg row" onclick="openSent(${i})"><div style="flex:1"><b>${s.s}</b><br><small>${s.c} · ${s.t}</small></div><span class="pill ok">Entregado</span></div>`).join("")
    );
  }
  function toggleChannel(key, el) {
    state.channels[key] = !state.channels[key];
    el.classList.toggle("on");
  }
  function previewMessage() {
    $("ps").textContent = $("ns").value || "(Sin asunto)";
    $("pm").textContent = $("nm").value || "El mensaje aparecerá aquí.";
    $("pt").textContent = $("nc").value;
  }
  function sendMessage() {
    const subject = $("ns").value, body = $("nm").value, to = $("nc").value;
    if (!subject.trim() || !body.trim()) return toast("Completa asunto y mensaje");
    if (!state.channels.c && !state.channels.p) return toast("Elige al menos un canal");
    $("sb").disabled = true;
    $("sb").textContent = "Enviando…";
    setTimeout(() => {
      sentMessages.unshift({ s: subject, c: to, t: "Ahora", m: body });
      render();
      toast("Aviso enviado");
    }, 900);
  }
  function openSent(i) {
    const s = sentMessages[i];
    modal("Mensaje enviado", mail(USER[state.role].name, s.s, s.c, s.m), btn("Cerrar", "o", "closeModal()"));
  }
  var composeHandlers = { toggleChannel, previewMessage, sendMessage, openSent };

  // js/views/iadm/index.js
  var iadmViews = {
    inicio: iadmHome,
    usuarios: iadmUsers,
    ...crudViews,
    // profesores, estudiantes, cursos, grupos
    hist: historyView,
    monit: monitoringView,
    reporte: reportsView,
    inst: identityView,
    notif: composeView
  };
  var iadmHandlers = { ...identityHandlers, ...crudHandlers };

  // js/views/prof/home.js
  var profHome = () => `<div class="acts"><button class="btn g" onclick="go('asist')">${ic("check")}Registrar asistencia</button><button class="btn" onclick="go('notif')">${ic("send")}Notificar</button><button class="btn o" onclick="go('hist')">${ic("clock")}Consultar historial</button></div><div class="grid">${kpi("Mis cursos", "2", "#1E3A8A", "book") + kpi("Estudiantes", "87", "#3B5BC7", "users") + kpi("Asistencias registradas", "1.940", "#10B981", "check") + kpi("Asistencia promedio", "95%", "#6366F1", "chart")}</div>` + card("Clases de hoy", table(["Hora", "Curso", "Aula", "Estado"], [["08:00", "Cálculo I", "A-101", '<span class="pill ok">Registrada</span>'], ["10:00", "Programación", "B-204", '<span class="pill wn">Pendiente</span>']]));

  // js/views/prof/students.js
  var profStudents = () => card(
    "Alumnos en mis cursos",
    table(["Estudiante", "Curso", "Asistencias", "Porcentaje"], [
      ["Ana Torres", "Cálculo I", "27/28", progress(96)],
      ["Bruno Díaz", "Cálculo I", "24/28", progress(86)],
      ["Camila Ríos", "Programación", "20/28", progress(71)],
      ["Elena Paz", "Programación", "28/28", progress(100)]
    ])
  );

  // js/views/prof/attendance.js
  var ROSTER = ["Ana Torres", "Bruno Díaz", "Camila Ríos", "Diego Soto", "Elena Paz", "Felipe Luna", "Gabriela Ortiz", "Hugo Vargas", "Inés Molina", "Jorge Cruz"];
  var attendanceView = () => state.session ? takeAttendance() : `<div class="acts"><button class="btn g" onclick="newSession()">${ic("plus")}Crear asistencia</button></div>` + card(
    "Sesiones recientes",
    table(
      ["Fecha", "Curso", "Grupo", "Presentes", "Ausentes", "Asistencia"],
      db.hist.filter((h) => h.pr == "Dr. Rivas").map((h) => [h.f, h.c, h.g || "A", h.p, h.a, pill(attendancePct(h))])
    )
  );
  function takeAttendance() {
    const s = state.session, r = s.r, p = r.filter((x) => x[1] === 1).length, a = r.filter((x) => x[1] === 0).length;
    return `<div class="card" style="margin-bottom:16px"><div class="chips"><span>${ic("book")}${s.c}</span><span>${ic("users")}${s.g}</span><span>${ic("cal")}${s.f}</span><span>${ic("clock")}${s.h}</span><span>${ic("id")}Dr. Carlos Rivas</span></div></div><div class="grid">${kpi("Presentes", p, "#10B981", "check") + kpi("Ausentes", a, "#EF4444", "users") + kpi("Sin marcar", r.length - p - a, "#F59E0B", "clock")}</div>` + card(
      "Lista de estudiantes · " + r.length,
      `<div class="bar" style="margin-bottom:14px"><i style="width:${(p + a) / r.length * 100}%;background:var(--ok)"></i></div><div class="acts" style="margin-bottom:6px"><button class="btn o" onclick="markAll()">Marcar todos presentes</button></div>` + r.map(
        (x, i) => `<div class="stu"><div class="av sm">${x[0][0]}</div><b>${x[0]}</b><div class="seg"><button class="${x[1] === 1 ? "on ok" : ""}" onclick="mark(${i},1)">Asistió</button><button class="${x[1] === 0 ? "on no" : ""}" onclick="mark(${i},0)">No asistió</button></div></div>`
      ).join("") + `<div class="acts" style="margin:16px 0 0;justify-content:flex-end"><button class="btn o" onclick="cancelSession()">Cancelar</button><button class="btn g" onclick="saveSession()">Guardar asistencia</button></div>`
    );
  }
  function newSession() {
    const n = /* @__PURE__ */ new Date();
    modal(
      "Crear asistencia",
      `<div class="mrow"><label>Curso</label><select id="sc"><option>Cálculo I</option><option>Programación</option></select></div><div class="mrow"><label>Grupo</label><select id="sg"><option>Grupo A</option><option>Grupo B</option></select></div><div class="mrow"><label>Fecha</label><input id="sf" value="${n.toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" })}" readonly></div><div class="mrow"><label>Hora</label><input id="sh" type="time" value="${n.toTimeString().slice(0, 5)}"></div><div class="mrow"><label>Profesor</label><input value="Dr. Carlos Rivas" readonly></div>`,
      btn("Cancelar", "o", "closeModal()") + btn("Crear y tomar lista", "g", "startSession()")
    );
  }
  function startSession() {
    const g = $("sg").value;
    state.session = {
      c: $("sc").value,
      g,
      f: $("sf").value,
      h: $("sh").value,
      r: (g == "Grupo A" ? ROSTER.slice(0, 7) : ROSTER.slice(3)).map((x) => [x, null])
    };
    closeModal();
    render();
  }
  function mark(i, v) {
    state.session.r[i][1] = v;
    render();
  }
  function markAll() {
    state.session.r.forEach((x) => x[1] = 1);
    render();
  }
  function cancelSession() {
    state.session = null;
    render();
  }
  function saveSession() {
    const s = state.session, r = s.r, pending = r.filter((x) => x[1] === null).length;
    if (pending) return toast("Faltan " + pending + " estudiantes por marcar");
    db.hist.unshift({
      id: Date.now(),
      f: s.f,
      c: s.c,
      g: s.g.slice(-1),
      pr: "Dr. Rivas",
      p: r.filter((x) => x[1] === 1).length,
      a: r.filter((x) => x[1] === 0).length
    });
    state.session = null;
    render();
    toast("Asistencia guardada");
  }
  var attendanceHandlers = { newSession, startSession, mark, markAll, cancelSession, saveSession };

  // js/views/prof/index.js
  var profViews = {
    inicio: profHome,
    estudiantes: profStudents,
    asist: attendanceView,
    hist: historyView,
    notif: composeView,
    reportes: reportsView
  };
  var profHandlers = { ...attendanceHandlers };

  // js/views/est/home.js
  var estHome = () => `<div class="grid">${kpi("Cursos inscritos", "5", "#1E3A8A", "book") + kpi("Asistencias registradas", "118", "#10B981", "check") + kpi("Ausencias", "9", "#EF4444", "clock") + kpi("Progreso general", "72%", "#3B5BC7", "chart")}</div>` + card("Mi asistencia por curso", table(["Curso", "Asistencias", "Porcentaje"], COURSES.map((c) => [c.name, Math.round(c.attendance * 0.28) + "/28", progress(c.attendance)]))) + `<br>` + card("Progreso del semestre", progress(72));

  // js/views/est/classes.js
  var estClasses = () => `<div class="grid g2">${card(
    "Semana actual",
    `<div class="cal"><div><b>Lun</b><em>08:00 Cálculo</em></div><div><b>Mar</b><em>10:00 Programación</em><em>14:00 Física</em></div><div><b>Mié</b><em>08:00 Cálculo</em></div><div><b>Jue</b><em>09:00 Química</em><em>10:00 Programación</em></div><div><b>Vie</b><em>11:00 Historia</em></div></div>`
  )}${card("Próximas clases", table(["Cuándo", "Curso", "Aula"], [["Hoy 10:00", "Programación", "B-204"], ["Mañana 08:00", "Cálculo I", "A-101"], ["Jue 09:00", "Química", "L-2"]]))}</div>`;

  // js/views/est/inbox.js
  var estInbox = () => card(
    "Bandeja de entrada",
    NOTIFICATIONS.est.map(
      (s, i) => `<div class="msg row" onclick="openInbox(${i})">${i < 2 ? '<span class="dot"></span>' : '<span style="width:8px"></span>'}<div class="av" style="width:34px;height:34px;font-size:12px">${s.from[0]}</div><div style="flex:1"><b>${s.title}</b><br><small>${s.from} · ${s.when}</small></div></div>`
    ).join("")
  );
  function openInbox(i) {
    const s = NOTIFICATIONS.est[i];
    modal(s.title, mail(s.from, s.title, "Ana Torres", "Hola Ana, te escribimos para informarte sobre este asunto. Revisa los detalles en tu panel de clases."), btn("Cerrar", "o", "closeModal()"));
  }
  var inboxHandlers = { openInbox };

  // js/views/est/index.js
  var estViews = { inicio: estHome, clases: estClasses, notif: estInbox };
  var estHandlers = { ...inboxHandlers };

  // js/views/shared/profile.js
  var FIELDS = [["Nombre completo", "n"], ["Correo institucional", "e"], ["Teléfono", "t"], ["Idioma", "i"]];
  var PREFS = ["Alertas por correo", "Notificaciones en el panel", "Resumen semanal"];
  function profileView() {
    const role = state.role, editing = state.profileEditing, u = USER[role];
    const d = state.profileData[role] || (state.profileData[role] = { n: u.name, e: u.email, t: "+507 6000-0000", i: "Español" });
    const student = role == "est";
    return `<div class="card pf"><div class="cover"></div><div class="pfh"><div class="av xl">${u.initials}</div><div style="flex:1;min-width:160px"><h3 style="font-size:20px;margin:0">${d.n}</h3><span style="color:var(--mu)">${u.label}</span></div><span class="pill ok">Cuenta activa</span>` + (editing ? btn("Cancelar", "o", "profileEdit(false)") + btn("Guardar", "g", "profileSave()") : btn(ic("edit") + "Editar perfil", "", "profileEdit(true)")) + `</div></div><div class="grid g2"><div class="card"><h3>Información personal</h3><div class="kv">${FIELDS.map(([label, k]) => `<div class="f"><span>${label}</span>${editing ? `<input id="pf_${k}" value="${d[k]}">` : `<b>${d[k]}</b>`}</div>`).join("")}</div></div><div><div class="card" style="display:flex;gap:18px;align-items:center;margin-bottom:16px;flex-wrap:wrap">${ring(student ? 92 : 95)}<div><b>Asistencia ${student ? "personal" : "de mis cursos"}</b><br><span style="color:var(--mu)">${student ? "Ingeniería · Semestre 4" : "Periodo 2026-II"}</span><br>${statusPill(student ? "Regular" : "Activo")}</div></div><div class="card"><h3>Preferencias</h3>${PREFS.map((t, i) => `<label class="sw ${editing ? "" : "off"}"><span>${t}</span><input type="checkbox" ${i < 2 ? "checked" : ""} ${editing ? "" : "disabled"}><i></i></label>`).join("")}</div></div></div>`;
  }
  function profileEdit(on) {
    state.profileEditing = on;
    render();
  }
  function profileSave() {
    const d = state.profileData[state.role];
    ["n", "e", "t", "i"].forEach((k) => d[k] = $("pf_" + k).value);
    state.profileEditing = false;
    render();
    toast("Perfil actualizado");
  }
  var profileHandlers = { profileEdit, profileSave };

  // js/views/shared/export.js
  function exportModal() {
    modal(
      "Exportar historial",
      `<p style="margin:0 0 12px;color:var(--mu)">Elige el formato del archivo.</p><div class="chs">${["PDF", "Excel", "CSV"].map((f) => `<button class="tg2" onclick="closeModal();toast('Exportado como ${f}')">${ic("down")}&nbsp;${f}</button>`).join("")}</div>`
    );
  }

  // js/main.js
  Object.assign(
    window,
    { toast, closeModal, go, toggleGroup, exportModal },
    historyHandlers,
    composeHandlers,
    profileHandlers,
    adminHandlers,
    iadmHandlers,
    profHandlers,
    estHandlers
  );
  registerViews("admin", { ...adminViews, perfil: profileView });
  registerViews("iadm", { ...iadmViews, perfil: profileView });
  registerViews("prof", { ...profViews, perfil: profileView });
  registerViews("est", { ...estViews, perfil: profileView });
  $("burger").innerHTML = ic("menu");
  $("bell").innerHTML = ic("bell") + '<span class="badge" id="bc"></span>';
  $("burger").onclick = () => $("side").classList.toggle("open");
  $("bell").onclick = () => go("notif");
  $("inst").onchange = (e) => {
    switchInstitution(e.target.value);
    state.instDraft = null;
    applyTheme();
    render();
  };
  $("role").onchange = (e) => {
    state.role = e.target.value;
    state.sec = "inicio";
    applyTheme();
    render();
  };
  startClock();
  applyTheme();
  render();
})();
</script></body></html>
