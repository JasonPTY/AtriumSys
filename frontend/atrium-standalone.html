<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ATRIUM · Gestión académica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
/* =========================================================
   01 · TOKENS
   ========================================================= */

:root {
    /* Colores principales */
    --c1: #1E3A8A;
    --ac: #10B981;
    --pri: #1E3A8A;
    --pri2: #3B5BC7;

    /* Superficies y texto */
    --bg: #F3F4F6;
    --card: #FFFFFF;
    --tx: #111827;
    --mu: #6B7280;
    --bd: #E5E7EB;

    /* Estados */
    --ok: #10B981;
    --bad: #EF4444;
    --warn: #F59E0B;

    /* Componentes */
    --side: #1E3A8A;
    --hov: #F9FAFB;

    /* Fondos de estado */
    --okb: #D1FAE5;
    --badb: #FEE2E2;
    --wb: #FEF3C7;

    /* Modelo de caja */
    box-sizing: border-box;

    /* Safe area */
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}


/* =========================================================
   02 · TEMA OSCURO AUTOMÁTICO
   ========================================================= */

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #0F172A;
        --card: #1E293B;
        --tx: #F1F5F9;
        --mu: #94A3B8;
        --bd: #334155;

        --side: #172554;
        --hov: #243247;

        --okb: #064E3B;
        --badb: #7F1D1D;
        --wb: #78350F;

        --pri: #93B4FF;
    }
}


/* =========================================================
   03 · TEMA OSCURO MANUAL
   ========================================================= */

:root[data-theme="dark"] {
    --bg: #0F172A;
    --card: #1E293B;
    --tx: #F1F5F9;
    --mu: #94A3B8;
    --bd: #334155;

    --side: #172554;
    --hov: #243247;

    --okb: #064E3B;
    --badb: #7F1D1D;
    --wb: #78350F;

    --pri: #93B4FF;
}


/* =========================================================
   04 · SAFE AREA / NAVEGACIÓN
   ========================================================= */

html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
}
/* =========================================================
   02 · BASE
   Reset, tipografía, body e iconos SVG
   ========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font: 14px/1.5 Inter, Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--tx);
}


/* =========================================================
   ICONOS SVG
   ========================================================= */

svg.i {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
}
/* =========================================================
   03 · SHELL
   Sidebar, navegación, usuario, header y estructura principal
   ========================================================= */


/* =========================================================
   SIDEBAR
   ========================================================= */

#side {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;

    width: 248px;

    display: flex;
    flex-direction: column;

    padding: 20px 12px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));

    background: var(--side);
    color: #fff;

    z-index: 20;
    transition: transform .2s;
}


/* =========================================================
   MARCA
   ========================================================= */

.logo {
    padding: 0 10px 4px;

    font-size: 22px;
    font-weight: 700;
    letter-spacing: .5px;
}

.logo b {
    color: var(--ac, #6EE7B7);
}

.sub {
    padding: 0 10px 18px;

    font-size: 12px;
    opacity: .7;
}


/* =========================================================
   NAVEGACIÓN
   ========================================================= */

#nav button {
    all: unset;
    box-sizing: border-box;

    display: flex;
    align-items: center;
    gap: 12px;

    width: 100%;
    padding: 10px 12px;
    margin-bottom: 2px;

    border-radius: 8px;

    cursor: pointer;
    color: #DBE4FF;
}

#nav button:hover {
    background: rgba(255, 255, 255, .1);
}

#nav button.on {
    background: #fff;
    color: #1E3A8A;
    font-weight: 600;
}

#nav button:focus-visible {
    outline: 2px solid #6EE7B7;
}


/* =========================================================
   USUARIO
   ========================================================= */

.me {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-top: auto;
    padding: 10px;

    border-top: 1px solid rgba(255, 255, 255, .15);

    font-size: 13px;
}

.av {
    width: 38px;
    height: 38px;

    display: grid;
    place-items: center;

    flex: none;

    border-radius: 50%;

    background: #10B981;
    color: #fff;

    font-weight: 700;
}


/* =========================================================
   CONTENEDOR PRINCIPAL
   ========================================================= */

#main {
    display: flex;
    flex-direction: column;

    min-height: 100vh;
    margin-left: 248px;
}


/* =========================================================
   HEADER
   ========================================================= */

header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);

    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;

    padding: 14px 24px;

    background: var(--card);
    border-bottom: 1px solid var(--bd);

    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 18px;
}

header p {
    margin: 0;

    color: var(--mu);
    font-size: 12px;
}

.sp {
    flex: 1;
}


/* =========================================================
   CONTROLES DEL HEADER
   ========================================================= */

#burger {
    display: none;
}

.ib {
    all: unset;

    position: relative;

    padding: 8px;
    border-radius: 8px;

    cursor: pointer;
    color: var(--mu);
}

.ib:hover {
    background: var(--bg);
}

.badge {
    position: absolute;
    top: 2px;
    right: 2px;

    padding: 0 5px;

    background: var(--bad);
    color: #fff;

    border-radius: 9px;

    font-size: 10px;
}


/* =========================================================
   CONTROLES DE FORMULARIO
   ========================================================= */

select,
input,
textarea {
    max-width: 100%;

    padding: 8px 10px;

    font: inherit;
    color: var(--tx);

    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 8px;
}


/* =========================================================
   RELOJ
   ========================================================= */

.clock {
    text-align: right;
    font-variant-numeric: tabular-nums;
}

.clock b {
    color: var(--pri);
    font-size: 16px;
}


/* =========================================================
   CONTENIDO
   ========================================================= */

main {
    flex: 1;
    padding: 24px;
}
/* =========================================================
   04 · COMPONENTES
   Grid, cards, estadísticas, tablas, estados, botones,
   calendario, formularios, footer y notificaciones
   ========================================================= */


/* =========================================================
   GRID
   ========================================================= */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
}

.g2 {
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}


/* =========================================================
   CARD
   ========================================================= */

.card {
    padding: 18px;

    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: 12px;
}

.card h3 {
    margin: 0 0 12px;

    font-size: 15px;
}


/* =========================================================
   ESTADÍSTICAS
   ========================================================= */

.stat {
    display: flex;
    align-items: center;
    gap: 14px;
}

.stat .ic {
    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    color: #fff;
}

.stat b {
    display: block;

    font-size: 24px;
    line-height: 1.1;
}

.stat span {
    color: var(--mu);
    font-size: 12px;
}


/* =========================================================
   BARRAS DE PROGRESO
   ========================================================= */

.bar {
    height: 8px;
    min-width: 80px;

    overflow: hidden;

    background: var(--bd);
    border-radius: 4px;
}

.bar i {
    display: block;
    height: 100%;
}


/* =========================================================
   TABLAS
   ========================================================= */

.tw {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 480px;

    border-collapse: collapse;
}

th {
    padding: 8px 10px;

    text-align: left;

    color: var(--mu);
    font-size: 12px;
    font-weight: 500;

    border-bottom: 1px solid var(--bd);
}

td {
    padding: 10px;

    border-bottom: 1px solid var(--bd);
}

tr:hover td {
    background: var(--hov);
}


/* =========================================================
   PILLS / ESTADOS
   ========================================================= */

.pill {
    padding: 2px 10px;

    border-radius: 99px;

    font-size: 12px;
    font-weight: 500;

    white-space: nowrap;
}

.ok {
    background: var(--okb);
    color: #047857;
}

.bad {
    background: var(--badb);
    color: #B91C1C;
}

.wn {
    background: var(--wb);
    color: #B45309;
}


/* =========================================================
   ESTADOS · TEMA OSCURO
   ========================================================= */

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .ok {
        color: #6EE7B7;
    }

    :root:not([data-theme="light"]) .bad {
        color: #FCA5A5;
    }

    :root:not([data-theme="light"]) .wn {
        color: #FCD34D;
    }
}


/* =========================================================
   BOTONES
   ========================================================= */

.btn {
    all: unset;
    box-sizing: border-box;

    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 9px 16px;

    background: var(--pri2);
    color: #fff;

    border-radius: 8px;

    cursor: pointer;
    font-weight: 500;
}

.btn:hover {
    filter: brightness(1.1);
}

.btn:focus-visible {
    outline: 2px solid var(--ok);
    outline-offset: 2px;
}

.btn.g {
    background: var(--ok);
}

.btn.o {
    background: transparent;
    color: var(--pri);
    border: 1px solid var(--bd);
}


/* =========================================================
   ACCIONES
   ========================================================= */

.acts {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;

    margin-bottom: 20px;
}


/* =========================================================
   TOGGLE
   ========================================================= */

.tg {
    all: unset;

    padding: 4px 12px;

    border-radius: 99px;

    cursor: pointer;

    font-size: 12px;
    font-weight: 600;
}


/* =========================================================
   MENSAJES
   ========================================================= */

.msg {
    padding: 12px 0;

    border-bottom: 1px solid var(--bd);
}

.msg:last-child {
    border: 0;
}

.msg small {
    color: var(--mu);
}


/* =========================================================
   CALENDARIO
   ========================================================= */

.cal {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.cal div {
    min-height: 90px;

    padding: 8px;

    background: var(--bg);
    border-radius: 8px;

    font-size: 12px;
}

.cal b {
    display: block;
    margin-bottom: 4px;
}

.cal em {
    display: block;

    margin-top: 4px;
    padding: 2px 6px;

    background: var(--pri2);
    color: #fff;

    border-radius: 4px;

    font-style: normal;
}


/* =========================================================
   FORMULARIOS
   ========================================================= */

.form {
    display: grid;
    gap: 10px;
}

.form label {
    color: var(--mu);
    font-size: 12px;
}


/* =========================================================
   FOOTER
   ========================================================= */

footer {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;

    padding: 16px 24px;

    background: var(--card);
    border-top: 1px solid var(--bd);

    color: var(--mu);
    font-size: 12px;
}

footer a {
    color: var(--pri);
    text-decoration: none;
}


/* =========================================================
   TOAST / NOTIFICACIÓN
   ========================================================= */

.toast {
    position: fixed;
    right: 24px;
    bottom: 24px;

    padding: 10px 16px;

    background: var(--tx);
    color: var(--bg);

    border-radius: 8px;

    z-index: 50;
}
/* =========================================================
   05 · REFINAMIENTOS VISUALES
   Sobrescriben componentes definidos en 03/04
   ========================================================= */


/* =========================================================
   SIDEBAR
   ========================================================= */

#side {
    background: linear-gradient(180deg, #1E3A8A, #122466);
}

#nav button {
    border-radius: 10px;
}

#nav button.on {
    background: rgba(255, 255, 255, .14);
    color: #fff;
    box-shadow: inset 3px 0 0 #10B981;
}


/* =========================================================
   MARCA
   ========================================================= */

.logo {
    font-size: 24px;
    font-weight: 800;
}


/* =========================================================
   HEADER
   ========================================================= */

header {
    background: color-mix(in srgb, var(--card) 90%, transparent);
    backdrop-filter: blur(8px);
}

.clock b {
    font-size: 20px;
    font-weight: 700;
}


/* =========================================================
   CARDS
   ========================================================= */

.card {
    border-radius: 16px;

    box-shadow:
            0 1px 2px rgba(16, 24, 40, .05),
            0 10px 24px -14px rgba(30, 58, 138, .18);
}

.card h3 {
    font-size: 14px;
    font-weight: 600;
}


/* =========================================================
   TABLAS
   ========================================================= */

th {
    background: var(--bg);
    border: 0;
    font-weight: 600;
}

th:first-child {
    border-radius: 8px 0 0 8px;
}

th:last-child {
    border-radius: 0 8px 8px 0;
}


/* =========================================================
   TÍTULOS DE CONTENIDO
   ========================================================= */

main h2 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.02em;
}


/* =========================================================
   KPI
   ========================================================= */

.kpi {
    padding: 16px 18px;
}

.kh {
    display: flex;
    justify-content: space-between;

    color: var(--mu);
    font-size: 13px;
}

.kh i {
    display: grid;
}

.kpi b {
    display: block;

    margin: 4px 0 6px;

    font-size: 30px;
    line-height: 1.1;
    letter-spacing: -.03em;
}

.kf {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.kf em {
    font-size: 12px;
    font-weight: 600;
    font-style: normal;
}

.up {
    color: var(--ok);
}

.dn {
    color: var(--bad);
}


/* =========================================================
   HERO
   ========================================================= */

.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;

    margin-bottom: 16px;
    padding: 24px;

    color: #fff;

    background:
            radial-gradient(
                    circle at 90% 0,
                    var(--pri2),
                    transparent 55%
            ),
            var(--c1);

    border-radius: 16px;
}

.hero small {
    display: block;
    opacity: .8;
}

.hero b {
    margin-right: 12px;

    font-size: 44px;
    letter-spacing: -.03em;
}

.hero .btn.o {
    color: #fff;
    border-color: rgba(255, 255, 255, .4);
}


/* =========================================================
   MAPA DE CALOR
   ========================================================= */

.heat {
    display: grid;

    grid-template-rows: repeat(5, 1fr);
    grid-auto-flow: column;
    grid-auto-columns: 1fr;

    gap: 4px;
}

.heat i {
    min-height: 16px;

    border-radius: 4px;
}

.hb {
    display: grid;
    grid-template-columns: 110px 1fr;
    align-items: center;
    gap: 10px;

    padding: 7px 0;
}
/* =========================================================
   06 · PANTALLAS Y FLUJOS
   Chips, asistencia, perfil, switches, modales y correo
   ========================================================= */


/* =========================================================
   CHIPS
   ========================================================= */

.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.chips span {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    padding: 6px 12px;

    background: var(--bg);
    border-radius: 99px;

    font-weight: 500;
}

.chips svg {
    width: 16px;
    height: 16px;

    color: var(--pri2);
}


/* =========================================================
   LISTA DE ESTUDIANTES / ASISTENCIA
   ========================================================= */

.stu {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;

    padding: 10px 0;

    border-bottom: 1px solid var(--bd);
}

.stu b {
    flex: 1;
    min-width: 120px;

    font-weight: 500;
}

.av.sm {
    width: 32px;
    height: 32px;

    font-size: 13px;
}


/* =========================================================
   SELECTOR SEGMENTADO
   ========================================================= */

.seg {
    display: flex;

    overflow: hidden;

    border: 1px solid var(--bd);
    border-radius: 10px;
}

.seg button {
    all: unset;

    padding: 7px 14px;

    cursor: pointer;

    color: var(--mu);
    font-size: 13px;
}

.seg .on.ok {
    background: var(--ok);
    color: #fff;
}

.seg .on.no {
    background: var(--bad);
    color: #fff;
}


/* =========================================================
   PERFIL
   ========================================================= */

.pf {
    padding: 0;
    margin-bottom: 16px;

    overflow: hidden;
}

.cover {
    height: 96px;

    background:
            radial-gradient(
                    circle at 80% 0,
                    var(--pri2),
                    transparent 60%
            ),
            var(--c1);
}

.pfh {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;

    padding: 0 20px 20px;
    margin-top: -36px;
}

.av.xl {
    width: 84px;
    height: 84px;

    border: 4px solid var(--card);

    font-size: 28px;
}


/* =========================================================
   SWITCHES
   ========================================================= */

.sw {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 11px 0;

    border-bottom: 1px solid var(--bd);

    cursor: pointer;
}

.sw input {
    display: none;
}

.sw i {
    position: relative;

    width: 38px;
    height: 22px;

    background: var(--bd);
    border-radius: 99px;

    transition: .2s;
}

.sw i:after {
    content: '';

    position: absolute;
    top: 3px;
    left: 3px;

    width: 16px;
    height: 16px;

    background: #fff;
    border-radius: 50%;

    transition: .2s;
}

.sw input:checked + i {
    background: var(--ok);
}

.sw input:checked + i:after {
    left: 19px;
}


/* =========================================================
   ACCIONES RÁPIDAS
   ========================================================= */

.ra {
    display: flex;
    gap: 2px;
}

.ra .ib {
    padding: 6px;
}


/* =========================================================
   MODAL
   ========================================================= */

.mo {
    position: fixed;
    inset: 0;

    display: grid;
    place-items: center;

    padding: 16px;

    background: rgba(15, 23, 42, .55);

    z-index: 60;
}

.md {
    width: 100%;
    max-width: 460px;
    max-height: 90vh;

    overflow: auto;

    background: var(--card);
    border-radius: 14px;
}


/* =========================================================
   CABECERA DEL MODAL
   ========================================================= */

.mh {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 14px 18px;

    border-bottom: 1px solid var(--bd);
}

.mh h3 {
    margin: 0;

    font-size: 16px;
}


/* =========================================================
   CUERPO Y FOOTER DEL MODAL
   ========================================================= */

.mb {
    padding: 18px;
}

.mf {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;

    padding: 0 18px 18px;
}


/* =========================================================
   DATOS / DETALLES
   ========================================================= */

.dl {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.dl small {
    display: block;

    color: var(--mu);
}


/* =========================================================
   FILAS DE FORMULARIO
   ========================================================= */

.mrow {
    display: grid;
    grid-template-columns: 70px 1fr;
    align-items: center;
    gap: 8px;

    margin-bottom: 10px;
}

.mrow label {
    color: var(--mu);
    font-size: 12px;
}

.mrow input,
.mrow select,
textarea {
    width: 100%;
}


/* =========================================================
   SELECTORES / TAGS
   ========================================================= */

.chs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.tg2 {
    all: unset;

    padding: 6px 14px;

    border: 1px solid var(--bd);
    border-radius: 99px;

    cursor: pointer;

    font-size: 13px;
}

.tg2.on {
    background: var(--pri2);
    color: #fff;
    border-color: var(--pri2);
}


/* =========================================================
   CORREO / MENSAJES
   ========================================================= */

.em {
    padding: 16px;

    background: var(--bg);
    border: 1px solid var(--bd);
    border-radius: 10px;
}

.eh {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-bottom: 10px;
}

.em h4 {
    margin: 8px 0;

    font-size: 16px;
}

.em p {
    margin: 0 0 12px;

    white-space: pre-wrap;
    word-break: break-word;
}


/* =========================================================
   INDICADORES Y FILAS
   ========================================================= */

.dot {
    width: 8px;
    height: 8px;

    flex: none;

    background: var(--pri2);
    border-radius: 50%;
}

.row {
    display: flex;
    align-items: center;
    gap: 10px;

    cursor: pointer;
}
/* =========================================================
   07 · RESPONSIVE Y NAVEGACIÓN AVANZADA
   Navegación agrupada, datos clave-valor y media queries
   ========================================================= */


/* =========================================================
   NAVEGACIÓN AGRUPADA
   ========================================================= */

#side {
    background:
            radial-gradient(
                    130% 55% at 0 100%,
                    color-mix(in srgb, var(--ac) 30%, transparent),
                    transparent 60%
            ),
            linear-gradient(
                    180deg,
                    color-mix(in srgb, var(--c1) 55%, #000),
                    var(--c1)
            );
}

#nav {
    flex: 1;
    overflow-y: auto;
}


/* Elementos principales y grupos */

#nav .ni,
#nav .gh {
    display: flex;
    align-items: center;
    gap: 12px;

    width: 100%;
    padding: 6px 8px;
    margin-bottom: 2px;

    border: 0;
    border-radius: 12px;

    cursor: pointer;

    background: none;
    color: #C7D4FF;

    font: inherit;
}

#nav .ti {
    width: 32px;
    height: 32px;

    display: grid;
    place-items: center;

    flex: none;

    background: rgba(255, 255, 255, .08);
    border-radius: 10px;
}


/* Hover */

#nav .ni:hover,
#nav .gh:hover {
    background: rgba(255, 255, 255, .09);
    color: #fff;
}


/* Elemento activo */

#nav .ni.on {
    background: #fff;
    color: var(--c1);
    font-weight: 600;

    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, .5);
}

#nav .ni.on .ti {
    background: var(--ac);
    color: #fff;
}


/* Cabecera de grupo */

#nav .gh .lb {
    flex: 1;

    text-align: left;

    font-size: 12px;
    opacity: .7;
}

#nav .gh .cv {
    width: 16px;
    height: 16px;

    transition: .2s;
}

#nav .gh.op .cv {
    transform: rotate(180deg);
}


/* Hijos del grupo */

#nav .ch {
    margin: 0 0 8px 24px;
    padding-left: 10px;

    border-left: 1px solid rgba(255, 255, 255, .18);
}

#nav .ch .ni {
    padding: 4px 8px;
    font-size: 13px;
}

#nav .ch .ti {
    width: 26px;
    height: 26px;

    border-radius: 8px;
}

#nav .ch .ti svg {
    width: 15px;
    height: 15px;
}


/* =========================================================
   DATOS CLAVE / VALOR
   ========================================================= */

.kv {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 18px;
}

.f span {
    display: block;

    margin-bottom: 4px;

    color: var(--mu);
    font-size: 12px;
}

.f b {
    display: block;

    padding: 9px 0;

    border-bottom: 1px solid var(--bd);

    font-weight: 500;

    word-break: break-word;
}

.f input {
    width: 100%;
}


/* =========================================================
   SWITCH DESACTIVADO
   ========================================================= */

.sw.off {
    opacity: .55;
    cursor: default;
}


/* =========================================================
   TABLET · 861px — 1100px
   Sidebar compacta
   ========================================================= */

@media (min-width: 861px) and (max-width: 1100px) {

    /* Sidebar */

    #side {
        width: 68px;

        padding-left: 8px;
        padding-right: 8px;
    }

    .lb,
    .sub,
    .me > div:last-child {
        display: none;
    }

    .logo {
        padding: 0;
        text-align: center;
        font-size: 11px;
    }

    #main {
        margin-left: 68px;
    }

    .me {
        justify-content: center;
    }


    /* Navegación */

    #nav .gh {
        display: none;
    }

    #nav .ch {
        display: block !important;

        margin: 0;
        padding: 0;

        border: 0;
    }

    #nav .ni {
        justify-content: center;
        padding: 5px 0;
    }

    #nav .ch .ti {
        width: 32px;
        height: 32px;
    }

    #nav .ch .ti svg {
        width: 20px;
        height: 20px;
    }
}

   MÓVIL · Hasta 520px
   ========================================================= */

@media (max-width: 520px) {

    .mrow {
        grid-template-columns: 1fr;
    }

    .mf .btn {
        flex: 1;
        justify-content: center;
    }

    .dl {
        grid-template-columns: 1fr;
    }
}

   ========================================================= */


/* =========================================================

   ========================================================= */

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 22px;
}

.lg {
    width: 36px;
    height: 36px;

    place-items: center;

    background: var(--ac);

    border-radius: 10px;

    font-size: 13px;

    height: 100%;

   ========================================================= */

.ins {
    display: grid;
    grid-template-columns:

.pvw {

.pvs {

    padding: 14px;

    color: #fff;

    padding: 16px;

.cp {

    gap: 8px;
}

.cp input[type="color"] {
    width: 44px;

    padding: 2px;

.cp input[type="text"],

/* =========================================================

/* =========================================================
   TABLET · 861px — 1100px
   ========================================================= */

    }

/* =========================================================
   TABLAS · MÓVIL HASTA 600px
   ========================================================= */

@media (max-width: 600px) {

        min-width: 0;
    }

    tr:first-child {
        display: none;
    }

        border-bottom: 1px solid var(--bd);

        border: 0;

  function previewMessage() {

    $("pm").textContent = $("nm").value || "El mensaje aparecerá aquí.";
    $("pt").textContent = $("nc").value;
  }
  function sendMessage() {
    const subject = $("ns").value, body = $("nm").value, to = $("nc").value;
    if (!subject.trim() || !body.trim()) return toast("Completa asunto y mensaje");
    if (!state.channels.c && !state.channels.p) return toast("Elige al menos un canal");
    $("sb").disabled = true;
    $("sb").textContent = "Enviando…";
    setTimeout(() => {
      sentMessages.unshift({ s: subject, c: to, t: "Ahora", m: body });
      render();
      toast("Aviso enviado");
    }, 900);
  }
  function openSent(i) {
    const s = sentMessages[i];
    modal("Mensaje enviado", mail(USER[state.role].name, s.s, s.c, s.m), btn("Cerrar", "o", "closeModal()"));
  }
  var composeHandlers = { toggleChannel, previewMessage, sendMessage, openSent };

  // js/views/iadm/index.js
  var iadmViews = {
    inicio: iadmHome,
    usuarios: iadmUsers,
    ...crudViews,
    // profesores, estudiantes, cursos, grupos
    hist: historyView,
    monit: monitoringView,
    reporte: reportsView,
    inst: identityView,
    notif: composeView
  };
  var iadmHandlers = { ...identityHandlers, ...crudHandlers };

  // js/views/prof/home.js
  var profHome = () => `<div class="acts"><button class="btn g" onclick="go('asist')">${ic("check")}Registrar asistencia</button><button class="btn" onclick="go('notif')">${ic("send")}Notificar</button><button class="btn o" onclick="go('hist')">${ic("clock")}Consultar historial</button></div><div class="grid">${kpi("Mis cursos", "2", "#1E3A8A", "book") + kpi("Estudiantes", "87", "#3B5BC7", "users") + kpi("Asistencias registradas", "1.940", "#10B981", "check") + kpi("Asistencia promedio", "95%", "#6366F1", "chart")}</div>` + card("Clases de hoy", table(["Hora", "Curso", "Aula", "Estado"], [["08:00", "Cálculo I", "A-101", '<span class="pill ok">Registrada</span>'], ["10:00", "Programación", "B-204", '<span class="pill wn">Pendiente</span>']]));

  // js/views/prof/students.js
  var profStudents = () => card(
    "Alumnos en mis cursos",
    table(["Estudiante", "Curso", "Asistencias", "Porcentaje"], [
      ["Ana Torres", "Cálculo I", "27/28", progress(96)],
      ["Bruno Díaz", "Cálculo I", "24/28", progress(86)],
      ["Camila Ríos", "Programación", "20/28", progress(71)],
      ["Elena Paz", "Programación", "28/28", progress(100)]
    ])
  );

  // js/views/prof/attendance.js
  var ROSTER = ["Ana Torres", "Bruno Díaz", "Camila Ríos", "Diego Soto", "Elena Paz", "Felipe Luna", "Gabriela Ortiz", "Hugo Vargas", "Inés Molina", "Jorge Cruz"];
  var attendanceView = () => state.session ? takeAttendance() : `<div class="acts"><button class="btn g" onclick="newSession()">${ic("plus")}Crear asistencia</button></div>` + card(
    "Sesiones recientes",
    table(
      ["Fecha", "Curso", "Grupo", "Presentes", "Ausentes", "Asistencia"],
      db.hist.filter((h) => h.pr == "Dr. Rivas").map((h) => [h.f, h.c, h.g || "A", h.p, h.a, pill(attendancePct(h))])
    )
  );
  function takeAttendance() {
    const s = state.session, r = s.r, p = r.filter((x) => x[1] === 1).length, a = r.filter((x) => x[1] === 0).length;
    return `<div class="card" style="margin-bottom:16px"><div class="chips"><span>${ic("book")}${s.c}</span><span>${ic("users")}${s.g}</span><span>${ic("cal")}${s.f}</span><span>${ic("clock")}${s.h}</span><span>${ic("id")}Dr. Carlos Rivas</span></div></div><div class="grid">${kpi("Presentes", p, "#10B981", "check") + kpi("Ausentes", a, "#EF4444", "users") + kpi("Sin marcar", r.length - p - a, "#F59E0B", "clock")}</div>` + card(
      "Lista de estudiantes · " + r.length,
      `<div class="bar" style="margin-bottom:14px"><i style="width:${(p + a) / r.length * 100}%;background:var(--ok)"></i></div><div class="acts" style="margin-bottom:6px"><button class="btn o" onclick="markAll()">Marcar todos presentes</button></div>` + r.map(
        (x, i) => `<div class="stu"><div class="av sm">${x[0][0]}</div><b>${x[0]}</b><div class="seg"><button class="${x[1] === 1 ? "on ok" : ""}" onclick="mark(${i},1)">Asistió</button><button class="${x[1] === 0 ? "on no" : ""}" onclick="mark(${i},0)">No asistió</button></div></div>`
      ).join("") + `<div class="acts" style="margin:16px 0 0;justify-content:flex-end"><button class="btn o" onclick="cancelSession()">Cancelar</button><button class="btn g" onclick="saveSession()">Guardar asistencia</button></div>`
    );
  }
  function newSession() {
    const n = /* @__PURE__ */ new Date();
    modal(
      "Crear asistencia",
      `<div class="mrow"><label>Curso</label><select id="sc"><option>Cálculo I</option><option>Programación</option></select></div><div class="mrow"><label>Grupo</label><select id="sg"><option>Grupo A</option><option>Grupo B</option></select></div><div class="mrow"><label>Fecha</label><input id="sf" value="${n.toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" })}" readonly></div><div class="mrow"><label>Hora</label><input id="sh" type="time" value="${n.toTimeString().slice(0, 5)}"></div><div class="mrow"><label>Profesor</label><input value="Dr. Carlos Rivas" readonly></div>`,
      btn("Cancelar", "o", "closeModal()") + btn("Crear y tomar lista", "g", "startSession()")
    );
  }
  function startSession() {
    const g = $("sg").value;
    state.session = {
      c: $("sc").value,
      g,
      f: $("sf").value,
      h: $("sh").value,
      r: (g == "Grupo A" ? ROSTER.slice(0, 7) : ROSTER.slice(3)).map((x) => [x, null])
    };
    closeModal();
    render();
  }
  function mark(i, v) {
    state.session.r[i][1] = v;
    render();
  }
  function markAll() {
    state.session.r.forEach((x) => x[1] = 1);
    render();
  }
  function cancelSession() {
    state.session = null;
    render();
  }
  function saveSession() {
    const s = state.session, r = s.r, pending = r.filter((x) => x[1] === null).length;
    if (pending) return toast("Faltan " + pending + " estudiantes por marcar");
    db.hist.unshift({
      id: Date.now(),
      f: s.f,
      c: s.c,
      g: s.g.slice(-1),
      pr: "Dr. Rivas",
      p: r.filter((x) => x[1] === 1).length,
      a: r.filter((x) => x[1] === 0).length
    });
    state.session = null;
    render();
    toast("Asistencia guardada");
  }
  var attendanceHandlers = { newSession, startSession, mark, markAll, cancelSession, saveSession };

  // js/views/prof/index.js
  var profViews = {
    inicio: profHome,
    estudiantes: profStudents,
    asist: attendanceView,
    hist: historyView,
    notif: composeView,
    reportes: reportsView
  };
  var profHandlers = { ...attendanceHandlers };

  // js/views/est/home.js
  var estHome = () => `<div class="grid">${kpi("Cursos inscritos", "5", "#1E3A8A", "book") + kpi("Asistencias registradas", "118", "#10B981", "check") + kpi("Ausencias", "9", "#EF4444", "clock") + kpi("Progreso general", "72%", "#3B5BC7", "chart")}</div>` + card("Mi asistencia por curso", table(["Curso", "Asistencias", "Porcentaje"], COURSES.map((c) => [c.name, Math.round(c.attendance * 0.28) + "/28", progress(c.attendance)]))) + `<br>` + card("Progreso del semestre", progress(72));

  // js/views/est/classes.js
  var estClasses = () => `<div class="grid g2">${card(
    "Semana actual",
    `<div class="cal"><div><b>Lun</b><em>08:00 Cálculo</em></div><div><b>Mar</b><em>10:00 Programación</em><em>14:00 Física</em></div><div><b>Mié</b><em>08:00 Cálculo</em></div><div><b>Jue</b><em>09:00 Química</em><em>10:00 Programación</em></div><div><b>Vie</b><em>11:00 Historia</em></div></div>`
  )}${card("Próximas clases", table(["Cuándo", "Curso", "Aula"], [["Hoy 10:00", "Programación", "B-204"], ["Mañana 08:00", "Cálculo I", "A-101"], ["Jue 09:00", "Química", "L-2"]]))}</div>`;

  // js/views/est/inbox.js
  var estInbox = () => card(
    "Bandeja de entrada",
    NOTIFICATIONS.est.map(
      (s, i) => `<div class="msg row" onclick="openInbox(${i})">${i < 2 ? '<span class="dot"></span>' : '<span style="width:8px"></span>'}<div class="av" style="width:34px;height:34px;font-size:12px">${s.from[0]}</div><div style="flex:1"><b>${s.title}</b><br><small>${s.from} · ${s.when}</small></div></div>`
    ).join("")
  );
  function openInbox(i) {
    const s = NOTIFICATIONS.est[i];
    modal(s.title, mail(s.from, s.title, "Ana Torres", "Hola Ana, te escribimos para informarte sobre este asunto. Revisa los detalles en tu panel de clases."), btn("Cerrar", "o", "closeModal()"));
  }
  var inboxHandlers = { openInbox };

  // js/views/est/index.js
  var estViews = { inicio: estHome, clases: estClasses, notif: estInbox };
  var estHandlers = { ...inboxHandlers };

  // js/views/shared/profile.js
  var FIELDS = [["Nombre completo", "n"], ["Correo institucional", "e"], ["Teléfono", "t"], ["Idioma", "i"]];
  var PREFS = ["Alertas por correo", "Notificaciones en el panel", "Resumen semanal"];
  function profileView() {
    const role = state.role, editing = state.profileEditing, u = USER[role];
    const d = state.profileData[role] || (state.profileData[role] = { n: u.name, e: u.email, t: "+507 6000-0000", i: "Español" });
    const student = role == "est";
    return `<div class="card pf"><div class="cover"></div><div class="pfh"><div class="av xl">${u.initials}</div><div style="flex:1;min-width:160px"><h3 style="font-size:20px;margin:0">${d.n}</h3><span style="color:var(--mu)">${u.label}</span></div><span class="pill ok">Cuenta activa</span>` + (editing ? btn("Cancelar", "o", "profileEdit(false)") + btn("Guardar", "g", "profileSave()") : btn(ic("edit") + "Editar perfil", "", "profileEdit(true)")) + `</div></div><div class="grid g2"><div class="card"><h3>Información personal</h3><div class="kv">${FIELDS.map(([label, k]) => `<div class="f"><span>${label}</span>${editing ? `<input id="pf_${k}" value="${d[k]}">` : `<b>${d[k]}</b>`}</div>`).join("")}</div></div><div><div class="card" style="display:flex;gap:18px;align-items:center;margin-bottom:16px;flex-wrap:wrap">${ring(student ? 92 : 95)}<div><b>Asistencia ${student ? "personal" : "de mis cursos"}</b><br><span style="color:var(--mu)">${student ? "Ingeniería · Semestre 4" : "Periodo 2026-II"}</span><br>${statusPill(student ? "Regular" : "Activo")}</div></div><div class="card"><h3>Preferencias</h3>${PREFS.map((t, i) => `<label class="sw ${editing ? "" : "off"}"><span>${t}</span><input type="checkbox" ${i < 2 ? "checked" : ""} ${editing ? "" : "disabled"}><i></i></label>`).join("")}</div></div></div>`;
  }
  function profileEdit(on) {
    state.profileEditing = on;
    render();
  }
  function profileSave() {
    const d = state.profileData[state.role];
    ["n", "e", "t", "i"].forEach((k) => d[k] = $("pf_" + k).value);
    state.profileEditing = false;
    render();
    toast("Perfil actualizado");
  }
  var profileHandlers = { profileEdit, profileSave };

  // js/views/shared/export.js
  function exportModal() {
    modal(
      "Exportar historial",
      `<p style="margin:0 0 12px;color:var(--mu)">Elige el formato del archivo.</p><div class="chs">${["PDF", "Excel", "CSV"].map((f) => `<button class="tg2" onclick="closeModal();toast('Exportado como ${f}')">${ic("down")}&nbsp;${f}</button>`).join("")}</div>`
    );
  }

  // js/main.js
  Object.assign(
    window,
    { toast, closeModal, go, toggleGroup, exportModal },
    historyHandlers,
    composeHandlers,
    profileHandlers,
    adminHandlers,
    iadmHandlers,
    profHandlers,
    estHandlers
  );
  registerViews("admin", { ...adminViews, perfil: profileView });
  registerViews("iadm", { ...iadmViews, perfil: profileView });
  registerViews("prof", { ...profViews, perfil: profileView });
  registerViews("est", { ...estViews, perfil: profileView });
  $("burger").innerHTML = ic("menu");
  $("bell").innerHTML = ic("bell") + '<span class="badge" id="bc"></span>';
  $("burger").onclick = () => $("side").classList.toggle("open");
  $("bell").onclick = () => go("notif");
  startClock();
  bootAuth({
    onEnter: () => {
      applyTheme();
      render();
    }
  });
})();
</script>
</body>

</html>
